services:
  # 1. Express Backend API Service (Docker)
  - type: web
    name: news-aggregator-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "5000"
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: news-postgres-db
          property: connectionString
      - key: JWT_SECRET
        value: super_secret_production_key_2026
      - key: NEWSDATA_API_KEY
        value: pub_eeddbe15580b4a329269dd0227d0a423

  # 2. React Frontend Web Service (Docker)
  - type: web
    name: news-aggregator-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: news-aggregator-backend
          property: url

databases:
  # 3. PostgreSQL Database Service
  - name: news-postgres-db
    databaseName: news_aggregator
    user: news_user
