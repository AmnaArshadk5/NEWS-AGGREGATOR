<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Daily Wire | Premium News Aggregator</title>
    <meta name="description" content="The Daily Wire compiles the latest global news headlines across technology, business, sports, science, health, and entertainment. Filter, search, and bookmark articles." />
    
    <!-- Prevent stale HTML page caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Automatic auto-reload handler for stale module bundle updates -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'last_asset_reload';
          var now = Date.now();
          var last = localStorage.getItem(key);
          if (!last || (now - parseInt(last, 10)) > 8000) {
            localStorage.setItem(key, now);
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
